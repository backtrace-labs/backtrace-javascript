name: Node.js CI

on:
    push:
        branches: [main, dev]
    pull_request:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

jobs:
    test_linux_all:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [20.x]

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ matrix.node-version }}
            - run: npm ci
            - run: node packages/react-native/scripts/generate-agent-version.cjs --check
            - run: npm run build
            - run: npm run lint
            - run: npm run format:check
            - run: npm test
            - name: smoke-test
              uses: ./.github/actions/smoke-tests
              with:
                  submit-url: ${{ secrets.SMOKETESTS_SUBMIT_LAYER_URL }}
                  direct-submit-url: ${{ secrets.SMOKETESTS_DIRECT_SUBMIT_URL }}
                  ignore-browser: 'true'

    smoke_browser_local:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      browser: chrome
                    - os: ubuntu-latest
                      browser: firefox
                    - os: macos-latest
                      browser: safari

        runs-on: ${{ matrix.os }}

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 20.x
            - run: npm ci
            - run: npm run build
            - name: smoke-test
              uses: ./.github/actions/smoke-tests
              with:
                  submit-url: ${{ secrets.SMOKETESTS_SUBMIT_LAYER_URL }}
                  direct-submit-url: ${{ secrets.SMOKETESTS_DIRECT_SUBMIT_URL }}
                  ignore-node: 'true'
                  browser-runner: 'local'
                  browser: ${{ matrix.browser }}

    smoke_browser_sauce:
        runs-on: ubuntu-latest
        continue-on-error: true

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 20.x
            - run: npm ci
            - run: npm run build
            # NOTE: sc version must match wdio.conf.ts
            - run: |
                  SC_VERSION=5.5.3
                  SC_DIR="node_modules/saucelabs/build/sc-loader/.sc-v$SC_VERSION-linux-x86_64"
                  mkdir -p "$SC_DIR"
                  curl -sSf "https://saucelabs.com/downloads/sauce-connect/$SC_VERSION/sauce-connect-${SC_VERSION}_linux.x86_64.tar.gz" | tar xz -C "$SC_DIR"
                  chmod +x "$SC_DIR/sc"
            - name: smoke-test
              uses: ./.github/actions/smoke-tests
              with:
                  submit-url: ${{ secrets.SMOKETESTS_SUBMIT_LAYER_URL }}
                  direct-submit-url: ${{ secrets.SMOKETESTS_DIRECT_SUBMIT_URL }}
                  sauce-username: ${{ secrets.SMOKETESTS_SAUCE_USERNAME }}
                  sauce-access-key: ${{ secrets.SMOKETESTS_SAUCE_ACCESS_KEY }}
                  ignore-node: 'true'

    test_linux:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                build-version: [20.x]
                node-version: [16.x, 18.x]

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Build using Node.js ${{ matrix.build-version }}
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ matrix.build-version }}
            - run: npm ci
            - run: npm run build
            - name: Test using Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ matrix.node-version }}
            - run: npm test
            - name: smoke-test
              uses: ./.github/actions/smoke-tests
              with:
                  submit-url: ${{ secrets.SMOKETESTS_SUBMIT_LAYER_URL }}
                  direct-submit-url: ${{ secrets.SMOKETESTS_DIRECT_SUBMIT_URL }}
                  sauce-username: ${{ secrets.SMOKETESTS_SAUCE_USERNAME }}
                  sauce-access-key: ${{ secrets.SMOKETESTS_SAUCE_ACCESS_KEY }}
                  ignore-browser: 'true'

    test_linux_pre_workspaces:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                build-version: [20.x]
                node-version: [14.x]

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Build using Node.js ${{ matrix.build-version }}
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ matrix.build-version }}
            - run: npm ci
            - run: npm run build
            - name: Test using Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ matrix.node-version }}
            - run: npm i -g npm@8
            - run: npm test
            - name: smoke-test
              uses: ./.github/actions/smoke-tests
              with:
                  submit-url: ${{ secrets.SMOKETESTS_SUBMIT_LAYER_URL }}
                  direct-submit-url: ${{ secrets.SMOKETESTS_DIRECT_SUBMIT_URL }}
                  sauce-username: ${{ secrets.SMOKETESTS_SAUCE_USERNAME }}
                  sauce-access-key: ${{ secrets.SMOKETESTS_SAUCE_ACCESS_KEY }}
                  ignore-browser: 'true'

    test_windows:
        runs-on: windows-latest

        strategy:
            matrix:
                build-version: [20.x]
                node-version: [18.x, 20.x]

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ matrix.build-version }}
            - run: npm ci
            - run: npm run build
            - name: Test using Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ matrix.node-version }}
            - run: npm test
            - name: smoke-test
              uses: ./.github/actions/smoke-tests
              with:
                  submit-url: ${{ secrets.SMOKETESTS_SUBMIT_LAYER_URL }}
                  direct-submit-url: ${{ secrets.SMOKETESTS_DIRECT_SUBMIT_URL }}
                  sauce-username: ${{ secrets.SMOKETESTS_SAUCE_USERNAME }}
                  sauce-access-key: ${{ secrets.SMOKETESTS_SAUCE_ACCESS_KEY }}
                  ignore-browser: 'true'
