import groovy.json.JsonOutput
import groovy.json.JsonSlurper

import javax.inject.Inject

abstract class BacktraceSourceMapUploadTask extends DefaultTask {
    @Input
    abstract Property<String> getVariantName()

    @InputFiles
    @PathSensitive(PathSensitivity.NONE)
    abstract ConfigurableFileCollection getSourceMap()

    @InputFiles
    @PathSensitive(PathSensitivity.NONE)
    abstract ConfigurableFileCollection getDebugIdFile()

    @InputFiles
    @PathSensitive(PathSensitivity.NONE)
    abstract ConfigurableFileCollection getConfigFile()

    @Internal
    abstract DirectoryProperty getProjectRoot()

    @OutputFile
    abstract RegularFileProperty getProcessedSourceMap()

    @Inject
    abstract ExecOperations getExecOperations()

    @TaskAction
    void upload() {
        def processed = processedSourceMap.get().asFile
        processed.delete()

        def variant = variantName.get()
        def map = sourceMap.singleFile
        def idFile = debugIdFile.singleFile
        def config = configFile.singleFile
        def debugId = idFile.isFile() ? idFile.getText("UTF-8").trim() : ""

        if (!map.isFile()) {
            logger.warn("Backtrace: Cannot find the ${variant} source map at ${map}. Hermes builds need -output-source-map in hermesFlags. Skipping the upload.")
            return
        }
        if (!debugId) {
            logger.warn("Backtrace: The ${variant} bundle has no debug id. Check that customSerializer is set to the Backtrace serializer in metro.config.js. Skipping the upload.")
            return
        }
        if (!config.isFile()) {
            logger.warn("Backtrace: Cannot find ${config}. Skipping the ${variant} source map upload.")
            return
        }

        def mapData = new JsonSlurper().parse(map, "UTF-8")
        mapData.debugId = debugId
        processed.parentFile.mkdirs()
        processed.setText(JsonOutput.toJson(mapData), "UTF-8")

        def command = ["npx", "--yes", "@backtrace/javascript-cli", "upload", "-p", processed.absolutePath]
        if (System.getProperty("os.name").toLowerCase().contains("windows")) {
            command = ["cmd", "/c"] + command
        }
        execOperations.exec { spec ->
            spec.workingDir(projectRoot.get().asFile)
            spec.commandLine(command)
        }
    }
}

def legacyTaskName = "uploadSourceMapsToBacktrace"

if (tasks.names.contains(legacyTaskName)) {
    return
}

def mentionsLegacyTask = { Collection<String> taskPaths -> taskPaths.any { it.substring(it.lastIndexOf(":") + 1) == legacyTaskName } }
def legacyRequested = mentionsLegacyTask(gradle.startParameter.taskNames)
def uploadsEnabled = !mentionsLegacyTask(gradle.startParameter.excludedTaskNames) &&
        providers.gradleProperty("backtraceUploadSourceMaps").getOrElse("true") != "false"
def legacyVariant = providers.gradleProperty("buildVariant").getOrElse("release")
def debugIdPath = providers.environmentVariable("DEBUG_ID_PATH").orNull
def projectRoot = rootProject.layout.projectDirectory.dir("..")
def buildDirectory = layout.buildDirectory
def sourceMapUploads = [:]
def uploadsByPackagingTask = [:]

def capitalize = { String name -> Character.toUpperCase(name.charAt(0)).toString() + name.substring(1) }
def bundleTaskNameOf = { String variantName -> "createBundle" + capitalize(variantName) + "JsAndAssets" }
def assetNameOf = { bundleTask -> bundleTask.hasProperty("bundleAssetName") ? bundleTask.bundleAssetName.get() : "index.android.bundle" }
def sourceMapOf = { bundleTask -> new File(bundleTask.jsSourceMapsDir.get().asFile, assetNameOf(bundleTask) + ".map") }
def debugIdFileOf = { bundleTask ->
    if (debugIdPath) {
        return projectRoot.file(debugIdPath).asFile
    }
    def packagerMapDir = bundleTask.hermesEnabled.get() ? bundleTask.jsIntermediateSourceMapsDir : bundleTask.jsSourceMapsDir
    return new File(packagerMapDir.get().asFile, ".backtrace-sourcemap-id")
}

def isDebuggable = { variant ->
    if (variant.hasProperty("debuggable")) {
        return variant.debuggable
    }
    def buildType = extensions.findByName("android")?.buildTypes?.findByName(variant.buildType)
    return buildType != null ? buildType.debuggable : variant.buildType == "debug"
}

def logDebuggableSkip = { String variantName ->
    def bundleTaskName = bundleTaskNameOf(variantName)
    if (tasks.names.contains(bundleTaskName)) {
        tasks.named(bundleTaskName).configure {
            it.doLast { task -> task.logger.lifecycle("Backtrace: ${variantName} is debuggable, skipping its source map upload.") }
        }
    }
}

def registerSourceMapUpload = { String variantName ->
    def bundleTaskName = bundleTaskNameOf(variantName)
    if (!tasks.names.contains(bundleTaskName)) {
        return
    }

    def capitalized = capitalize(variantName)
    def bundle = tasks.named(bundleTaskName)
    def debugIdSnapshot = buildDirectory.file("intermediates/backtrace/sourcemaps/${variantName}/.backtrace-sourcemap-id")

    bundle.configure { bundleTask ->
        def sourceMap = sourceMapOf(bundleTask)
        def debugIdFile = debugIdFileOf(bundleTask)
        def snapshot = debugIdSnapshot.get().asFile
        bundleTask.outputs.file(snapshot)
        bundleTask.doFirst { [sourceMap, debugIdFile, snapshot]*.delete() }
        bundleTask.doLast {
            if (debugIdFile.isFile()) {
                snapshot.parentFile.mkdirs()
                snapshot.bytes = debugIdFile.bytes
            }
        }
    }

    def upload = tasks.register("uploadSourceMapsToBacktrace" + capitalized, BacktraceSourceMapUploadTask) { task ->
        def bundleTask = bundle.get()
        task.group = "backtrace"
        task.description = "Uploads the ${variantName} source map to Backtrace."
        task.dependsOn(bundle)
        task.variantName.set(variantName)
        task.sourceMap.from(sourceMapOf(bundleTask))
        task.debugIdFile.from(debugIdSnapshot)
        task.configFile.from(projectRoot.file(".backtracejsrc"))
        task.projectRoot.set(projectRoot)
        task.processedSourceMap.set(buildDirectory.file("intermediates/backtrace/sourcemaps/${variantName}/${assetNameOf(bundleTask)}.map"))
    }
    sourceMapUploads[variantName] = upload

    if (uploadsEnabled) {
        uploadsByPackagingTask["package" + capitalized] = upload
        uploadsByPackagingTask["package" + capitalized + "Bundle"] = upload
    }
}

tasks.configureEach { task ->
    def upload = uploadsByPackagingTask[task.name]
    if (upload) {
        task.finalizedBy(upload)
    }
}

tasks.register(legacyTaskName) { task ->
    task.group = "backtrace"
    task.description = "Uploads the -PbuildVariant source map (default: release) to Backtrace. Release builds upload on their own."
    if (legacyRequested) {
        task.dependsOn({
            def upload = sourceMapUploads.find { it.key.equalsIgnoreCase(legacyVariant) }?.value
            if (!upload) {
                task.logger.warn("Backtrace: No release variant named '${legacyVariant}' has a React Native bundle to upload.")
            }
            return upload ?: []
        })
    }
}

plugins.withId("com.facebook.react") {
    plugins.withId("com.android.application") {
        def androidComponents = extensions.getByName("androidComponents")
        androidComponents.onVariants(androidComponents.selector().all()) { variant ->
            if (isDebuggable(variant)) {
                logDebuggableSkip(variant.name)
            } else {
                registerSourceMapUpload(variant.name)
            }
        }
    }
}
